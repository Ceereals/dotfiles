packages:
  common:
    - bat
    - btop
    - direnv
    - eza
    - fastfetch
    - fd
    - fzf
    - git
    - jq
    - lazygit
    - mise
    - neovim
    - ripgrep
    - starship
    - tmux
    - zoxide

  linux:
    pacman:
      - lazydocker
      - ghostty
    aur: []

    # Debian servers: explicit, self-contained list — NOT `common` + overrides.
    # Names are Debian's (fd-find, not fd). Deliberately absent: mise and
    # lazygit — servers stay minimal. starship is in, so the prompt over SSH
    # matches the desktop; lazydocker comes from `binaries` below.
    # The install script skips anything this release doesn't ship, so adding a
    # package that only exists in a newer Debian is safe.
    apt:
      - bat
      - btop
      - ca-certificates
      - curl
      - direnv
      - eza
      - fastfetch
      - fd-find
      - fzf
      - git
      - htop
      - jq
      - less
      - neovim
      - ripgrep
      - rsync
      - starship
      - tmux
      - unzip
      - zoxide

    # Not in any Debian archive: fetched from the upstream GitHub release into
    # ~/.local/bin. Deliberately unpinned — the install script resolves the
    # latest tag on each run, so these track upstream the way apt packages do.
    # VERSION and ARCH in `asset` are substituted by that script.
    github:
      - repo: jesseduffield/lazydocker
        bin: lazydocker
        asset: lazydocker_VERSION_Linux_ARCH.tar.gz

  darwin:
    brews:
      - bash
      - bash-completion@2
      - coreutils
      - gnu-sed
      - lazydocker
      - pinentry-mac
    casks:
      - ghostty
      - font-jetbrains-mono-nerd-font
      - aerospace
      - karabiner-elements
      - raycast
      - firefox
      - visual-studio-code
      - docker-desktop
      - obsidian
      - localsend
