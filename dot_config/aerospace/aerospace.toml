# AeroSpace — Hyprland di Omarchy portato su macOS.
# Allineato ai default di Omarchy v4.0.1 (default/hypr/bindings/*.lua).
#
# Traduzione dei modificatori:
#   Omarchy SUPER          -> alt      (su macOS cmd e' monopolizzato dalle app)
#   Omarchy ALT secondario -> ctrl     (alt e' gia' preso da SUPER)
#
# I nomi dei tasti di AeroSpace sono POSIZIONI sulla QWERTY US, non caratteri.
# Su questa tastiera fisica italiana:
#   slash -> -    rightSquareBracket -> +    backtick -> <
#   minus -> '    equal -> ì               semicolon -> ò
# Dove Omarchy usa code:20/21 (i tasti - e = della US) qui servono i tasti
# fisici - e + , cioe' 'slash' e 'rightSquareBracket'.

config-version = 2

after-login-command = []
after-startup-command = []
start-at-login = true
auto-reload-config = true

# Con config-version = 2 i workspace persistenti non sono piu' dedotti dai
# keybinding: senza questa riga quelli vuoti sparirebbero.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true

key-mapping.preset = 'qwerty'

# Chiavi puntate, NON una tabella [gaps]: un header [gaps] si mangerebbe
# tutte le chiavi top-level scritte dopo di lui.
gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.right = 8
gaps.outer.top = 8
gaps.outer.bottom = 8

[mode.main.binding]

# ---------------------------------------------------------------- applicazioni
# Omarchy: SUPER+RETURN terminale, SUPER+ALT+RETURN tmux,
#          SUPER+SHIFT+RETURN browser.
alt-enter = 'exec-and-forget open -na Ghostty'
alt-ctrl-enter = '''exec-and-forget open -na Ghostty --args -e bash -lc "tmux attach || tmux new -s Work"'''
alt-shift-enter = 'exec-and-forget open -a Firefox'

alt-shift-b = 'exec-and-forget open -a Firefox'
alt-shift-f = 'exec-and-forget open -a Finder'
alt-shift-n = 'exec-and-forget open -a "Visual Studio Code"'
alt-shift-o = 'exec-and-forget open -a Obsidian'
alt-shift-d = '''exec-and-forget open -na Ghostty --args -e lazydocker'''
# Omarchy: SUPER+SHIFT+SLASH = gestore password. Qui e' il tasto fisico -.
alt-shift-slash = 'exec-and-forget open -a Bitwarden'

# ------------------------------------------------------------------ focus
# Omarchy v4 usa le FRECCE, non hjkl: SUPER+J e SUPER+L sono occupati da
# "toggle split" e "toggle workspace layout".
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

# Omarchy: SUPER+SHIFT+frecce scambia la finestra con la vicina.
alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

# --------------------------------------------------------------- finestre
alt-w = 'close'
alt-t = 'layout floating tiling'   # Omarchy: SUPER+T
alt-f = 'fullscreen'               # Omarchy: SUPER+F
alt-j = 'layout horizontal vertical'  # Omarchy: SUPER+J, toggle split
alt-l = 'layout tiles accordion'      # Omarchy: SUPER+L, toggle layout workspace

# Omarchy: SUPER+code:20/21, cioe' i tasti - e = . Qui - e + fisici.
alt-slash = 'resize smart -50'
alt-rightSquareBracket = 'resize smart +50'

# ------------------------------------------------------------- workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Omarchy: SUPER+TAB avanti, SUPER+SHIFT+TAB indietro,
#          SUPER+CTRL+TAB torna all'ultimo usato.
alt-tab = 'workspace --wrap-around next'
alt-shift-tab = 'workspace --wrap-around prev'
alt-ctrl-tab = 'workspace-back-and-forth'

# Omarchy: SUPER+SHIFT+ALT+frecce sposta il workspace di monitor.
alt-shift-ctrl-left = 'move-workspace-to-monitor --wrap-around prev'
alt-shift-ctrl-right = 'move-workspace-to-monitor --wrap-around next'

# Modalita' service: AeroSpace non ha equivalente in Omarchy. 'backtick' e' il
# tasto fisico < a sinistra dello shift.
alt-backtick = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Copy'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'
