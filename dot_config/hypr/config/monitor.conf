# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                     Monitor Configuration                   ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Monitor wiki https://wiki.hyprland.org/Configuring/Monitors/

# Explicit refresh: "preferred" was picking each panel's EDID 60Hz timing.
# DP-1 panel max 165Hz (also 160/155/144/120). DP-2 panel max 100Hz (also 85).
monitor = DP-1, 2560x1440@165, 0x0, 1
monitor = DP-2, 2560x1440@100, 2560x0, 1
# Fallback for any other / hotplugged output.
monitor = , preferred, auto, 1

# Workspace → monitor pinning (Omarchy-style split): 1-5 live on DP-1, 6-10 on
# DP-2, so MOD+N always lands on the same physical screen. `default:true` is
# what each monitor shows at startup. No `persistent`: DMS's bar is set to
# show occupied workspaces only, persistent ones would clutter it.
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-2, default:true
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
# 9 = workspace gioco (window rule steam_app_default), pinnata su DP-1 = ASUS 165Hz
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-2


# If you need to scale things like steam etc, please uncomment these lines.
#xwayland {
#  force_zero_scaling = true       # Unscale XWayland
#}

# Adjust GDK_SCALE accordingly to your liking.
#env = GDK_SCALE, 2                # GDK Scaling Factor (no fractional scaling)

# Electron based apps use X11 as default, auto should detect wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto
