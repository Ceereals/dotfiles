general {
     # DMS Material lock is the primary locker (idempotent if already locked via
     # its loginctl integration); hyprlock only as fallback if the shell is dead.
     lock_cmd        = dms ipc lock lock || (pidof hyprlock || hyprlock)
     before_sleep_cmd = loginctl lock-session         # logind dispatches lock_cmd
     after_sleep_cmd  = hyprctl dispatch dpms on
 }

 listener {
     timeout     = 600                                # 10 min → lock
     on-timeout  = loginctl lock-session
 }

 # DPMS-off disabilitato: su AMD RDNA4 (RX 9070 XT) + DisplayPort il link DP
 # non sempre ri-esegue il link training al risveglio → schermi neri + lag.
 # I monitor vanno in standby col loro timeout interno. Per ripristinare,
 # togli i commenti qui sotto.
 # listener {
 #     timeout     = 900                                # 15 min → DPMS off
 #     on-timeout  = hyprctl dispatch dpms off
 #     on-resume   = hyprctl dispatch dpms on
 # }