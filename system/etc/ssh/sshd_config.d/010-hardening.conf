# /etc/ssh/sshd_config.d/010-hardening.conf
#
# sshd legge i drop-in dall'Include a riga 19 di sshd_config e per ogni
# opzione tiene il PRIMO valore incontrato: il prefisso 010 garantisce che
# queste righe vincano su tutto il resto.
#
# Solo chiavi, niente password: le chiavi stanno nell'agent di Bitwarden e
# ~/.ssh/authorized_keys le elenca.

PasswordAuthentication no

# Indispensabile insieme alla riga sopra: macOS ha UsePAM yes, e senza questa
# PAM continuerebbe ad accettare la password per via keyboard-interactive.
KbdInteractiveAuthentication no

PermitRootLogin no
PubkeyAuthentication yes

# Chiude le sessioni morte invece di lasciarle appese.
ClientAliveInterval 120
ClientAliveCountMax 3
